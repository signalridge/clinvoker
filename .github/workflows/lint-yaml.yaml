name: Lint YAML
on:
  push:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.yaml'
      - '**/*.yml'
permissions:
  contents: read
jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .
