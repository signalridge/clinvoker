name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  GO_VERSION: "1.24"
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go_any_changed }}
      yaml: ${{ steps.changes.outputs.yaml_any_changed }}
      workflows: ${{ steps.changes.outputs.workflows_any_changed }}
      markdown: ${{ steps.changes.outputs.markdown_any_changed }}
      tests: ${{ steps.changes.outputs.tests_any_changed }}
    steps:
      - uses: actions/checkout@v6
      - name: Detect file changes
        id: changes
        uses: tj-actions/changed-files@v46
        with:
          files_yaml: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
            yaml:
              - '**/*.yaml'
              - '**/*.yml'
              - '!.github/workflows/**'
            workflows:
              - '.github/workflows/**'
            markdown:
              - '**/*.md'
              - '!CHANGELOG.md'
              - '.markdownlint.yaml'
            tests:
              - 'test/**'
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install yamllint
        run: pip install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: .markdownlint.yaml
          globs: |
            **/*.md
            !CHANGELOG.md
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          args: --timeout=5m
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          files: coverage.txt
          fail_ci_if_error: false
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [changes, lint-go, test]
    if: |
      always() &&
      needs.changes.outputs.go == 'true' &&
      (needs.lint-go.result == 'success' || needs.lint-go.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build -v ./...
      - name: Vet
        run: go vet ./...
      - name: Verify go.mod
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
  cross-compile:
    name: Cross Compile
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      always() &&
      needs.changes.outputs.go == 'true' &&
      needs.build.result == 'success'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o clinvk-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/clinvk
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: |
      always() &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.tests == 'true') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build Instrumented Binary
        run: |
          mkdir -p .cov/e2e/raw
          go build -cover -coverpkg=./... -o bin/clinvk ./cmd/clinvk
          chmod +x bin/clinvk
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Basic CLI smoke test
        run: |
          ./bin/clinvk version
          ./bin/clinvk --help
          ./bin/clinvk config show
          ./bin/clinvk sessions list
          ./bin/clinvk --dry-run "test"
      - name: Run CLI integration tests
        run: |
          chmod +x test/run_cli_tests.sh test/cli/*.sh test/lib/*.sh
          ./test/run_cli_tests.sh
        env:
          CLINVK_BIN: ${{ github.workspace }}/bin/clinvk
          GOCOVERDIR: ${{ github.workspace }}/.cov/e2e/raw
      - name: Run API integration tests
        run: |
          chmod +x test/run_api_tests.sh test/api/*.sh
          ./test/run_api_tests.sh
        env:
          CLINVK_BIN: ${{ github.workspace }}/bin/clinvk
          SERVER_PORT: "18080"
          GOCOVERDIR: ${{ github.workspace }}/.cov/e2e/raw
      - name: Coverage Gate (Unit + E2E Union)
        env:
          COVERAGE_MIN_TOTAL: "75"
          COVERAGE_MIN_CONFIG: "60"
          COVERAGE_MIN_EXECUTOR: "60"
        run: |
          set -euo pipefail

          mkdir -p .cov
          go test ./... -coverpkg=./... -covermode=set -coverprofile=.cov/unit.set.cover.out
          go tool covdata textfmt -i=.cov/e2e/raw -o .cov/e2e.cover.out

          awk '
            $1=="mode:" {next}
            {
              k=$1" "$2
              v=$3+0
              if (!(k in cov) || v > cov[k]) cov[k]=v
            }
            END {
              for (k in cov) print k" "cov[k]
            }
          ' \
            .cov/unit.set.cover.out .cov/e2e.cover.out | sort > .cov/combined.body
          { echo 'mode: set'; cat .cov/combined.body; } > .cov/combined.cover.out

          total_pct=$(go tool cover -func=.cov/combined.cover.out | awk '$1=="total:" {gsub(/%/,"",$3); print $3}')
          echo "Combined coverage: ${total_pct}%"

          awk -v actual="${total_pct}" -v min="${COVERAGE_MIN_TOTAL}" 'BEGIN { exit((actual+0) < (min+0)) }' || {
            echo "::error::Combined coverage ${total_pct}% is below threshold ${COVERAGE_MIN_TOTAL}%"
            exit 1
          }

          awk '
            NR==1 {next}
            {
              split($1,p,":")
              file=p[1]
              stm=$2+0
              cnt=$3+0
              pkg=file
              sub(/\/[^\/]+$/, "", pkg)
              total[pkg]+=stm
              covered[pkg]+=(cnt>0?stm:0)
            }
            END {
              for (k in total) printf "%s %.2f\n", k, (100*covered[k]/total[k])
            }
          ' \
            .cov/combined.cover.out > .cov/combined.by_pkg.txt

          config_pkg="github.com/signalridge/clinvoker/internal/config"
          executor_pkg="github.com/signalridge/clinvoker/internal/executor"
          config_pct=$(awk -v target="${config_pkg}" '$1==target {print $2}' .cov/combined.by_pkg.txt)
          executor_pct=$(awk -v target="${executor_pkg}" '$1==target {print $2}' .cov/combined.by_pkg.txt)

          echo "Package coverage: ${config_pkg}=${config_pct}%"
          echo "Package coverage: ${executor_pkg}=${executor_pct}%"

          awk -v actual="${config_pct}" -v min="${COVERAGE_MIN_CONFIG}" 'BEGIN { exit((actual+0) < (min+0)) }' || {
            echo "::error::${config_pkg} coverage ${config_pct}% is below threshold ${COVERAGE_MIN_CONFIG}%"
            exit 1
          }

          awk -v actual="${executor_pct}" -v min="${COVERAGE_MIN_EXECUTOR}" 'BEGIN { exit((actual+0) < (min+0)) }' || {
            echo "::error::${executor_pkg} coverage ${executor_pct}% is below threshold ${COVERAGE_MIN_EXECUTOR}%"
            exit 1
          }
