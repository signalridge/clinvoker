name: Integration Tests
on:
  push:
    branches: [main]
    paths:
      - 'test/**'
  pull_request:
    branches: [main]
    paths:
      - 'test/**'
permissions:
  contents: read
env:
  GO_VERSION: "1.24"
jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: |
          go build -o bin/clinvk ./cmd/clinvk
          chmod +x bin/clinvk
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Basic CLI smoke test
        run: |
          ./bin/clinvk version
          ./bin/clinvk --help
          ./bin/clinvk config show
          ./bin/clinvk sessions list
          ./bin/clinvk --dry-run "test"
      - name: Run CLI integration tests
        run: |
          chmod +x test/run_cli_tests.sh test/cli/*.sh test/lib/*.sh
          ./test/run_cli_tests.sh
        env:
          CLINVK_BIN: ${{ github.workspace }}/bin/clinvk
      - name: Run API integration tests
        run: |
          chmod +x test/run_api_tests.sh test/api/*.sh
          ./test/run_api_tests.sh
        env:
          CLINVK_BIN: ${{ github.workspace }}/bin/clinvk
          SERVER_PORT: "18080"
